[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigard-ml"
version = "0.1.0"
description = "Pipelines reproducibles de datos y ML para SIGARD"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
official = ["openpyxl==3.1.5"]
database = ["openpyxl==3.1.5", "SQLAlchemy==2.0.35", "psycopg2-binary==2.9.12", "alembic==1.14.0"]

[project.scripts]
sigard-build-territorial = "sigard_ml.ingestion.territorial:main"
sigard-build-temporal = "sigard_ml.ingestion.temporal:main"
sigard-build-synthetic = "sigard_ml.simulation.pipeline:main"
sigard-build-modeling-panel = "sigard_ml.features.pipeline:main"
sigard-export-mvp = "sigard_ml.presentation.mvp_export:main"
sigard-predictive-status = "sigard_ml.forecasting.lifecycle:main"
sigard-build-backtest = "sigard_ml.forecasting.backtest_bundle:main"
sigard-build-territorial-analysis = "sigard_ml.territorial.analysis:main"
sigard-audit-structural-index = "sigard_ml.territorial.audit:main"
sigard-export-frontend-mvp = "sigard_ml.export.frontend_mvp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
