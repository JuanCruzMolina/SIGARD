[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigard-ml"
version = "0.1.0"
description = "Pipelines reproducibles de datos y ML para SIGARD"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sigard-build-territorial = "sigard_ml.ingestion.territorial:main"
sigard-build-temporal = "sigard_ml.ingestion.temporal:main"
sigard-build-synthetic = "sigard_ml.simulation.pipeline:main"
sigard-build-modeling-panel = "sigard_ml.features.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
